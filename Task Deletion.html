<!DOCTYPE html>
<html>
<head>
    <title>Task Deletion Confirmation & Feedback</title>
</head>

<body>

<h2>Task Deletion Confirmation & Feedback</h2>

<button onclick="deleteTask()">Delete Task</button>

<script>

function deleteTask()
{
    alert("You are about to delete a task.");

    var result = confirm("Do you want to delete the task?");

    if(result)
    {
        var feedback = prompt("Enter the reason for deletion:");

        alert("Task Deleted Successfully!\nReason: " + feedback);
    }
    else
    {
        alert("Task Deletion Cancelled.");
    }
}

</script>

</body>
</html>
